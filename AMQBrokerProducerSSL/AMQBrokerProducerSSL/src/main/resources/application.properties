# ActiveMQ Artemis Broker Configuration
# Replace these values with your actual broker details

# Broker URL - format: tcp://hostname:port
amq.servicename=tcp://localhost:61616

# SSL Configuration
amq.ssl.enabled=true
# Path to your truststore file (you'll need to create this from the broker's keystore)
amq.ssl.truststore=/home/mdicarlo/Programmi/Templates/Integration-templates/AMQBrokerProducerSSL/TrustStore/client-truststore.ts
# Truststore password
amq.ssl.truststore-pwd=password

# Broker Credentials
# Default Artemis credentials (change these to match your broker's users)
amq.username=admin
amq.password=admin

# Optional timeouts
amq.call-timeout=45000
amq.consumer-window-size=0

# Logging
logging.level.org.apache.camel=INFO
logging.level.org.apache.activemq=INFO
logging.level.com.arjuna=INFO
logging.level.org.messaginghub=INFO

logging.level.org.apache.activemq.artemis=INFO
logging.level.org.apache.activemq.artemis.core.client=INFO
logging.level.org.apache.activemq.artemis.core.remoting=INFO